name: adb_wifi
description: Android-only Flutter plugin that pairs with, connects to and installs APKs on a device over ADB Wireless debugging (used for the Wear OS watch installer).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.chameleon.adbwifi
        pluginClass: AdbWifiPlugin
